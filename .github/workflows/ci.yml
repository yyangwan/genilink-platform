name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genilink
          POSTGRES_PASSWORD: genilink_dev
          POSTGRES_DB: genilink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://genilink:genilink_dev@localhost:5432/genilink
          AUTH_SECRET: test-secret

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build
        env:
          DATABASE_URL: postgresql://genilink:genilink_dev@localhost:5432/genilink
          AUTH_SECRET: test-secret

  container:
    name: Build and publish production image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/yyangwan/genilink-platform:${{ github.sha }}
            ghcr.io/yyangwan/genilink-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Blue-green production deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: genilink-production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and deploy verified image
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/yyangwan/genilink-platform:${{ github.sha }}
        run: |
          logout_registry() {
            ssh "$PROD_USER@$PROD_HOST" "docker logout ghcr.io >/dev/null 2>&1 || true"
          }
          trap logout_registry EXIT
          printf '%s' "$GHCR_TOKEN" | ssh "$PROD_USER@$PROD_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh "$PROD_USER@$PROD_HOST" \
            "git -C /opt/genilink-platform pull --ff-only origin main && /opt/genilink-platform/deploy/deploy-container.sh '$IMAGE'"
