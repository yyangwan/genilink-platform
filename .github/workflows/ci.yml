name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genilink
          POSTGRES_PASSWORD: genilink_dev
          POSTGRES_DB: genilink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate and apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://genilink:genilink_dev@localhost:5432/genilink

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://genilink:genilink_dev@localhost:5432/genilink
          AUTH_SECRET: test-secret

      - name: Test deployment environment normalization
        run: bash deploy/test-prepare-docker-env.sh

      - name: Test container key permission preparation
        run: sudo bash deploy/test-container-key-access.sh

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build
        env:
          DATABASE_URL: postgresql://genilink:genilink_dev@localhost:5432/genilink
          AUTH_SECRET: test-secret

  container:
    name: Build and publish production image
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genilink
          POSTGRES_PASSWORD: genilink_dev
          POSTGRES_DB: genilink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/yyangwan/genilink-platform:${{ github.sha }}
            ghcr.io/yyangwan/genilink-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image migration runtime
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --network host \
            --env DATABASE_URL=postgresql://genilink:genilink_dev@127.0.0.1:5432/genilink \
            ghcr.io/yyangwan/genilink-platform:${{ github.sha }} \
            sh -c 'cd /prisma-runtime && node node_modules/prisma/build/index.js migrate deploy'

      - name: Smoke test image signing-key access
        if: github.event_name == 'pull_request'
        run: |
          . deploy/container-runtime.env
          KEY_DIR="$(mktemp -d)"
          trap 'sudo rm -rf "$KEY_DIR"' EXIT
          openssl genpkey -algorithm RSA -out "$KEY_DIR/private.pem" -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in "$KEY_DIR/private.pem" -pubout -out "$KEY_DIR/public.pem"
          sudo chown "root:$FRONTEND_KEYS_GID" "$KEY_DIR" "$KEY_DIR/private.pem" "$KEY_DIR/public.pem"
          sudo chmod 0750 "$KEY_DIR"
          sudo chmod 0640 "$KEY_DIR/private.pem" "$KEY_DIR/public.pem"
          DEPLOY_CONTAINER_LIB_ONLY=1
          KEYS_DIR="$KEY_DIR"
          source deploy/deploy-container.sh
          trap 'sudo rm -rf "$KEY_DIR"' EXIT
          verify_image_key_access ghcr.io/yyangwan/genilink-platform:${{ github.sha }}

  deploy:
    name: Blue-green production deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: genilink-production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Transfer and deploy verified image
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          IMAGE: ghcr.io/yyangwan/genilink-platform:${{ github.sha }}
        run: |
          SSH_OPTIONS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip -1 | \
            ssh "${SSH_OPTIONS[@]}" "$PROD_USER@$PROD_HOST" \
              "gzip -dc | docker load >/dev/null"
          ssh "${SSH_OPTIONS[@]}" "$PROD_USER@$PROD_HOST" \
            "git -C /opt/genilink-platform pull --ff-only origin main && SKIP_IMAGE_PULL=1 /opt/genilink-platform/deploy/deploy-container.sh '$IMAGE'"
