<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeniLink · 页面原型图总览</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d14;color:#e4e4e7;font:14px/1.7 'Microsoft YaHei',system-ui,sans-serif}main{max-width:1500px;margin:0 auto;padding:42px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:30px;margin:6px 0 10px}p{color:#a3abc0;margin:0}a{color:inherit;text-decoration:none}button,.button{display:inline-block;padding:10px 16px;background:#00d4aa;color:#08271f;border-radius:7px;font-size:13px;font-weight:600}.eyebrow{color:#00d4aa;font-size:12px;letter-spacing:1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{border:1px solid #30364a;background:#12151f;border-radius:11px;overflow:hidden}.caption{padding:19px 22px;display:flex;gap:16px;align-items:center}.number{color:#00d4aa;font:18px monospace}.caption h2{margin:0;font-size:17px}.caption p{font-size:12px;margin-top:5px}.caption a{margin-left:auto;font-size:12px;color:#00d4aa;white-space:nowrap}.preview{display:block;background:#080a10;border-top:1px solid #30364a}.preview img{width:100%;height:360px;object-fit:cover;object-position:top;display:block}.preview:hover img{filter:brightness(1.1)}footer{margin-top:30px;color:#a3abc0;font-size:12px}.supplement{display:flex;gap:20px;margin:20px 0;color:#b3a3ff}.supplement a{text-decoration:underline}@media(max-width:800px){main{padding:20px}.grid{grid-template-columns:1fr}header{display:block}.button{margin-top:16px}.preview img{height:300px}h1{font-size:24px}}</style></head><body><main><header><div><div class="eyebrow">GENILINK / PROTOTYPE V1 / 2026.10.13</div><h1>品牌可见性分析 · 页面原型图</h1><p>仅覆盖新增与改动模块。点击图片查看完整大图，打开交互原型可沿分析流程浏览。</p></div><a class="button" href="index.html">打开可点击原型 →</a></header><div class="grid" id="gallery"></div><div class="supplement"><a href="images/evidence-parameter.png" target="_blank" rel="noopener">补充状态：参数冲突证据</a><a href="images/evidence-mobile.png" target="_blank" rel="noopener">补充状态：移动端证据页</a></div><footer>全部品牌、文章和数字为虚构示例，不代表真实审计或任何平台的固定偏好。交互均在本地演示，不连接业务系统。</footer></main><script>const pages=[['overview','审计洞察','汇总全量分析、采集覆盖和本期优先行动'],['platforms','同提示词跨平台对照','品牌表现、来源与建议逐平台展示'],['brands','品牌发现与对比','未登记实体可发现、核实身份并加入重点监测'],['sources','来源文章库','全文、部分正文、受限与待处理状态清晰呈现'],['evidence','观点与原文证据','左右对照回答和段落，分清事实、假设和缺失信息'],['actions','优化行动','共性与专项任务，材料核实及平台验收目标'],['brief','内容创作方案','建议携带证据包、事实限制和复测目标进入创作'],['measure','行动效果复测','执行与效果分开，逐平台观察变化及不确定性']];document.getElementById('gallery').innerHTML=pages.map(([id,title,desc],i)=>`<article><div class="caption"><span class="number">0${i+1}</span><div><h2>${title}</h2><p>${desc}</p></div><a href="index.html#${id}">交互页面 →</a></div><a class="preview" href="images/${id}.png" target="_blank" rel="noopener"><img src="images/${id}.png" alt="${title}页面原型"></a></article>`).join('');</script></body></html>
